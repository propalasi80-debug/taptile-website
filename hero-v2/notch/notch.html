<!doctype html>
<html lang="en" class="pos-top">
<head>
<meta charset="utf-8">
<title>Taptile notch</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* The notch (the 0.9.1 design): a white notch hanging from the screen edge. The shape is driven by critically damped
   springs (response .38 s) so it can be reversed mid-flight from its current size; contents materialise in after it,
   card by card. It lives in its own transparent, always-on-top window (main.js) that only takes the mouse over the
   notch itself. Layout (position, size, style, what it shows, panel sections, animation) comes from Settings → Notch. */
:root{
  --paper:#ffffff; --card:#f5f5f7; --card2:#ebebef; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#aeaeb2; --inkhi:#000000;
  --ring:rgba(0,0,0,.075); --line:rgba(0,0,0,.1); --dotring:rgba(0,0,0,.18); --live:#34c759; --warm:#ff9500;
  --thumb:#ffffff; --tgoff:#d9d9de; --track:#e3e3e8; --artbg:#d8d8de; --artbg2:#c4c4cc;
  --out:cubic-bezier(.2,.9,.25,1); --edge:20px; --dy:1;
  --sh:0 0 0 .5px var(--ring),0 1px 2px rgba(0,0,0,.05),0 6px 16px -6px rgba(0,0,0,.14);
  --sho:0 0 0 .5px var(--ring),0 1px 2px rgba(0,0,0,.05),0 14px 30px -10px rgba(0,0,0,.20),0 34px 60px -24px rgba(0,0,0,.22);
}
/* Black: the same notch, inverted */
html.theme-dark{
  --paper:#0b0b0c; --card:#1c1c1e; --card2:#2c2c2e; --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#636366; --inkhi:#ffffff;
  --ring:rgba(255,255,255,.09); --line:rgba(255,255,255,.12); --dotring:rgba(255,255,255,.28);
  --thumb:#3a3a3c; --tgoff:#3a3a3c; --track:#2c2c2e; --artbg:#3a3a3c; --artbg2:#2c2c2e;
}
/* bottom centre: mirrored, rounded top corners, opens upward */
html.pos-bottom{
  --dy:-1;
  --sh:0 0 0 .5px var(--ring),0 -1px 2px rgba(0,0,0,.05),0 -6px 16px -6px rgba(0,0,0,.14);
  --sho:0 0 0 .5px var(--ring),0 -1px 2px rgba(0,0,0,.05),0 -14px 30px -10px rgba(0,0,0,.20),0 -34px 60px -24px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,'Segoe UI Variable','Segoe UI',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #0071e3;outline-offset:2px}
.tab{font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- the shape */
#n{position:absolute;left:50%;top:0;width:204px;height:34px;transform:translateX(-50%);background:var(--paper);border-radius:0 0 17px 17px;overflow:hidden;will-change:width,height;
  box-shadow:var(--sh);transition:box-shadow .35s var(--out),background-color .3s ease}
#n.open{box-shadow:var(--sho)}
html.pos-top-left #n{left:var(--edge);transform:none}
html.pos-top-right #n{left:auto;right:var(--edge);transform:none}
html.pos-bottom #n{top:auto;bottom:0}

/* ---------------------------------------------------------------- closed: the pill */
.pill{position:absolute;left:0;right:0;top:0;height:34px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 15px 0 13px;transition:opacity .16s ease,filter .16s ease}
html.pos-bottom .pill{top:auto;bottom:0}
#n.open .pill{opacity:0;filter:blur(4px);pointer-events:none}
.pl,.pr{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.pr{color:var(--ink2);font-weight:500}
/* content changes slide and cross-fade: the old content leaves, the new one drops in from the screen edge */
.swap{animation:swapin .34s var(--out)}
.pill.leave{pointer-events:none;animation:swapout .22s ease forwards}
@keyframes swapin{from{opacity:0;filter:blur(3px);transform:translateY(calc(var(--dy) * -7px)) scale(.96)}to{opacity:1;filter:none;transform:none}}
@keyframes swapout{from{opacity:1}to{opacity:0;filter:blur(3px);transform:translateY(calc(var(--dy) * 7px)) scale(.97)}}
.gdot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 .5px var(--dotring),0 0 7px 1px var(--gc,transparent);transition:background-color .3s ease}
.mini{width:20px;height:20px;border-radius:5px;flex:none;background-size:cover;background-position:center;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.clip{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.clip.wide{max-width:220px}
.clip.st{max-width:270px}
.pill.meas{left:auto!important;right:auto!important;top:-200px!important;bottom:auto!important;width:max-content;visibility:hidden;pointer-events:none}
.eq{display:flex;align-items:center;gap:2px;height:13px}
.eq i{width:2.5px;height:4px;border-radius:2px;background:var(--ink);animation:eq 1.1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.8s}.eq i:nth-child(4){animation-delay:-.2s}
.eq.paused i{animation:none;background:var(--ink3)}
@keyframes eq{0%,100%{height:4px}50%{height:13px}}
.kcap{height:20px;min-width:24px;padding:0 6px;border-radius:6px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line),inset 0 -1.5px 0 rgba(0,0,0,.08);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.kcap svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kcap.hit{animation:hit .24s var(--out)}
@keyframes hit{0%{transform:scale(.86) translateY(calc(var(--dy) * 1px))}100%{transform:none}}
/* shortcut keys (Settings → Notch → Show shortcut keys): small keycaps, the only place for the mono face */
.cks{display:flex;gap:3px}
.ck{height:17px;min-width:17px;padding:0 4px;border-radius:5px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line);font:500 9.5px 'JetBrains Mono',ui-monospace,monospace;color:var(--ink2);display:flex;align-items:center;justify-content:center}

/* ---------------------------------------------------------------- open: the panel */
.panel{position:absolute;left:50%;top:0;width:660px;height:196px;margin-left:-330px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;pointer-events:none}
html.pos-top-left .panel{left:0;margin-left:0!important}
html.pos-top-right .panel{left:auto;right:0;margin-left:0!important}
html.pos-bottom .panel{top:auto;bottom:0}
#n.open .panel{pointer-events:auto}
.mat{opacity:0;transform:scale(.97) translateY(calc(var(--dy) * -4px));filter:blur(6px);transition:opacity .14s ease,transform .3s var(--out),filter .2s ease}
#n.open .mat{opacity:1;transform:none;filter:none;transition:opacity .28s ease,transform .5s var(--out),filter .34s ease}
#n.open .mat.d1{transition-delay:.05s}#n.open .mat.d2{transition-delay:.09s}#n.open .mat.d3{transition-delay:.13s}#n.open .mat.d4{transition-delay:.17s}

.top{display:flex;align-items:center;justify-content:space-between;height:22px;padding:0 4px 0 6px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;min-width:0;white-space:nowrap}
.who .st{font-weight:500;color:var(--ink2)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(52,199,89,.16);flex:none;transition:background .3s,box-shadow .3s}
.sdot.off{background:var(--ink3);box-shadow:none}
.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);font-weight:500}
.ib{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:background .15s,color .15s,transform .12s var(--out)}
.ib:hover{background:var(--card);color:var(--ink)}.ib:active{transform:scale(.9)}
.ib svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* one even inset all round: 12px sides, bottom and between cards; card radius 20 = outer 32 - 12 (concentric) */
.cards{flex:1;display:grid;grid-template-columns:272px 1fr 132px;gap:12px;min-height:0}
.c{background:var(--card);border-radius:20px;padding:12px;display:flex;flex-direction:column;min-width:0}
.c[hidden]{display:none}
/* rearranging the panel cards: press and drag a card, like moving apps on a phone */
.c{touch-action:none}
.c[data-lift]{position:relative;z-index:3;scale:1.035;cursor:grabbing;box-shadow:0 18px 34px -10px rgba(0,0,0,.28),0 0 0 .5px var(--line);transition:scale .22s var(--out),box-shadow .22s var(--out)}
.c[data-drop]{transition:translate .34s cubic-bezier(.2,.9,.25,1),scale .26s var(--out),box-shadow .26s var(--out)!important}
.cards.arranging .c:not([data-lift]){animation:jig .26s ease-in-out infinite alternate}
.cards.arranging .c:not([data-lift]):nth-child(2n){animation-delay:-.13s}
@keyframes jig{from{rotate:-.45deg}to{rotate:.45deg}}
html.rm .cards.arranging .c{animation:none}
.lbl{font-size:11px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:space-between;height:14px}

/* now playing */
.np{flex-direction:row;gap:12px;align-items:stretch}
.art{width:76px;height:76px;border-radius:14px;flex:none;align-self:center;background:var(--artbg);position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 18px -8px rgba(0,0,0,.35);transition:transform .45s var(--out)}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.al{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .45s ease}
.al.in{opacity:1}
.al svg{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);fill:rgba(255,255,255,.95)}
.np.paused .art{transform:scale(.92)}
.npm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tt{font-size:14px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.ar{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.scrub{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:9.5px;font-weight:600;color:var(--ink3)}
.bar{flex:1;height:4px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:inherit}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.cb{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .12s var(--out)}
.cb:hover{background:var(--card2)}.cb:active{transform:scale(.88)}
.cb svg{width:15px;height:15px;fill:var(--ink)}
.cb.play{width:34px;height:34px;background:var(--ink)}
.cb.play svg{fill:var(--paper);width:14px;height:14px}
.cb.play:hover{background:var(--inkhi)}
.np.none .ctl,.np.none .scrub{opacity:.35;pointer-events:none}

/* pad: layouts + underglow */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;padding:3px;border-radius:12px;background:var(--card2)}
.thumb{position:absolute;left:3px;top:3px;border-radius:9px;background:var(--thumb);box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.04);will-change:transform}
.ly{position:relative;z-index:1;height:28px;border-radius:9px;font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;padding:0 9px;white-space:nowrap;overflow:hidden;transition:color .2s,transform .12s var(--out)}
.ly span{overflow:hidden;text-overflow:ellipsis}
.ly:hover{color:var(--ink)}.ly.on{color:var(--ink)}
.ly i{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 0 .5px var(--dotring)}
.ly:active{transform:scale(.96)}
.glow{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:8px}
.sw{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18);transition:transform .2s var(--out),box-shadow .2s}
.sw:hover{transform:scale(1.15)}.sw:active{transform:scale(.92)}
.sw.on{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18),0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.tg{margin-left:auto;width:36px;height:22px;border-radius:99px;background:var(--tgoff);position:relative;flex:none;transition:background .25s,transform .12s var(--out)}
.tg:active{transform:scale(.94)}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.tg.on{background:var(--live)}.tg.on::after{transform:translateX(14px)}
.auto{font-size:11px;font-weight:600;color:var(--live)}

/* focus */
.fc{align-items:center}
.fc .lbl{align-self:stretch}
.dial{position:relative;width:76px;height:76px;margin-top:6px}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dial .trk{stroke:var(--track)}
#fring{transition:stroke-dashoffset 1s linear,stroke .3s ease}
.dial .tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;letter-spacing:-.02em}
.dial .tm.run{color:var(--warm)}
.fbs{display:flex;gap:4px;margin-top:auto;padding-top:6px;align-self:stretch}
.fb{flex:1;height:24px;border-radius:8px;background:var(--card2);font-size:10.5px;font-weight:700;color:var(--ink2);transition:background .15s,color .15s,transform .12s var(--out)}
.fb:hover{color:var(--ink)}.fb:active{transform:scale(.94)}
.fb.go{background:var(--ink);color:var(--paper)}

/* Settings → Notch → Animation: Reduced (and the system's reduce-motion setting): no movement, short fades only */
html.rm .mat,html.rm #n.open .mat{transition:opacity .2s ease!important;transform:none!important;filter:none!important}
html.rm .eq i{animation:none}
html.rm .swap,html.rm .pill.leave{animation:fade .18s ease}
html.rm .pill.leave{animation-direction:reverse;opacity:0}
html.rm .kcap.hit{animation:none}
html.rm #fring{transition:none}
html.rm .np.paused .art{transform:none}
html.rm .cb,html.rm .ly,html.rm .sw,html.rm .fb,html.rm .ib,html.rm .tg{transition:background .15s,color .15s}
html.rm .cb:active,html.rm .ly:active,html.rm .sw:active,html.rm .sw:hover,html.rm .fb:active,html.rm .ib:active,html.rm .tg:active{transform:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="n" role="region" aria-label="Taptile notch">
  <div class="pill" id="pill"></div>
  <div class="panel" id="panel">
    <div class="top mat">
      <span class="who"><span class="sdot off" id="sdot"></span><span id="padname">Taptile</span><span class="st" id="padst">No Dialect connected</span></span>
      <span class="meta"><span class="tab" id="time">--:--</span>
        <button class="ib" id="openapp" title="Open Taptile for Business" aria-label="Open Taptile for Business"><svg viewBox="0 0 16 16"><path d="M6.5 3.5H4.2a.7.7 0 0 0-.7.7v7.6c0 .4.3.7.7.7h7.6c.4 0 .7-.3.7-.7V9.5M9.5 3.5h3v3M12.5 3.5L7.6 8.4"/></svg></button></span>
    </div>
    <div class="cards" id="cards">
      <section class="c np none mat" id="np" aria-label="Now playing">
        <div class="art" id="art"></div>
        <div class="npm">
          <div class="lbl"><span id="npapp">Now Playing</span></div>
          <div class="tt" id="tt">Nothing playing</div>
          <div class="ar" id="ar">Music from any app shows here</div>
          <div class="scrub tab"><span id="tpos">0:00</span><span class="bar"><i id="tbar"></i></span><span id="tleft">0:00</span></div>
          <div class="ctl">
            <button class="cb" data-m="prev" aria-label="Previous"><svg viewBox="0 0 16 16"><path d="M3.5 3h1.6v10H3.5zM13 3.8v8.4a.5.5 0 0 1-.8.4L6.5 8.4a.5.5 0 0 1 0-.8l5.7-4.2a.5.5 0 0 1 .8.4z"/></svg></button>
            <button class="cb play" data-m="playpause" aria-label="Play or pause"><svg viewBox="0 0 16 16" id="ppi"></svg></button>
            <button class="cb" data-m="next" aria-label="Next"><svg viewBox="0 0 16 16"><path d="M12.5 3h-1.6v10h1.6zM3 3.8v8.4a.5.5 0 0 0 .8.4l5.7-4.2a.5.5 0 0 0 0-.8L3.8 3.4a.5.5 0 0 0-.8.4z"/></svg></button>
          </div>
        </div>
      </section>
      <section class="c mat" id="padc" aria-label="Your Dialect">
        <div class="lbl"><span>Layout</span><span class="auto" id="auto"></span></div>
        <div class="seg" id="seg"><span class="thumb" id="thumb"></span></div>
        <div class="glow" id="glow"></div>
      </section>
      <section class="c fc mat" id="fc" aria-label="Focus timer">
        <div class="lbl"><span>Focus</span><span id="fend" class="tab"></span></div>
        <div class="dial"><svg viewBox="0 0 76 76"><circle class="trk" cx="38" cy="38" r="32" fill="none" stroke-width="6"/><circle id="fring" cx="38" cy="38" r="32" fill="none" stroke="#ff9500" stroke-width="6" stroke-linecap="round" stroke-dasharray="201.06" stroke-dashoffset="201.06"/></svg><span class="tm tab" id="ftm">25:00</span></div>
        <div class="fbs" id="fbs"></div>
      </section>
    </div>
  </div>
</div>
<script>
(function () {
  // ?preview: inside Settings → Notch (or a browser). No desktop bridge; Settings drives it through window.__notch.
  const PREVIEW = /[?&]preview\b/.test(location.search);
  // The notch window's bridge (notch-preload.js). window.tfb.notch is the 0.9.1 shape, kept for tests.
  const api = PREVIEW ? null : window.tfbNotch || (window.tfb && window.tfb.notch) || null;
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement, n = $('n'), pill = $('pill'), panel = $('panel');
  let SW = [['White', '#FFFFFF'], ['Red', '#FF2A2A'], ['Amber', '#FF8A00'], ['Green', '#20E070'], ['Cyan', '#00D5FF'], ['Blue', '#3B5BFF']];
  // Same defaults as TFB.notch.DEFAULT in tfb.js; every message and state update carries the saved config.
  const DEF = { position: 'top', size: 'regular', theme: 'light', duration: 1.8, chips: false, colour: true, hover: true, motion: 'smooth',
    show: { keys: true, knobs: true, layouts: true, status: true, media: true }, panel: { media: true, pad: true, focus: true }, order: ['media', 'pad', 'focus'] };
  const ZOOM = { compact: 0.88, regular: 1, large: 1.15 };
  let cfg = JSON.parse(JSON.stringify(DEF));
  let pad = { connected: false, name: 'Your Dialect', firmware: '', layer: 0, layouts: ['Office', 'Editing', 'Streaming', 'Coding'], colors: [0, 2, 4, 3], auto: true, glow: true, col: 0 };
  const EMPTY = { title: '', artist: '', app: '', playing: false, art: '', pos: 0, dur: 0, upd: 0, hint: '', note: '' };
  let media = Object.assign({}, EMPTY);
  let toast = null, toastT = 0, toastTimer = 0, seq = 0, open = false, openT = 0, closeT = 0, over = false;
  const focus = { mins: 25, left: 25 * 60, run: false, end: 0 };
  const APPS = { spotify: ['Spotify', '#1db954'], chrome: ['Chrome', '#4285f4'], msedge: ['Edge', '#0c8484'], firefox: ['Firefox', '#ff7139'], vlc: ['VLC', '#ff8800'], zunemusic: ['Media Player', '#e3008c'], music: ['Music', '#fa2d48'], discord: ['Discord', '#5865f2'], tidal: ['TIDAL', '#111111'], deezer: ['Deezer', '#a238ff'] };
  const appOf = (id) => { const k = String(id || '').toLowerCase(); for (const a in APPS) if (k.indexOf(a) >= 0) return APPS[a]; const nm = k.split(/[!\\.]/).filter(Boolean)[0] || ''; return [nm ? nm.charAt(0).toUpperCase() + nm.slice(1) : 'Now Playing', '#8e8e93']; };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cssUrl = (u) => 'url("' + String(u).replace(/["\\\n\r]/g, (c) => '\\' + c.charCodeAt(0).toString(16) + ' ') + '")';
  const mmss = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const mm2 = (s) => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const hex6 = (c) => (/^#[0-9a-f]{6}$/i.test(String(c || '')) ? String(c) : /^#[0-9a-f]{3}$/i.test(String(c || '')) ? '#' + c.slice(1).split('').map((x) => x + x).join('') : '');
  const NOTE = '<svg viewBox="0 0 24 24"><path d="M9 18.2V6.6l10-2.1v11.2a2.9 2.9 0 1 1-1.6-2.6V8.3L10.6 9.7v8.5a2.9 2.9 0 1 1-1.6-2.6z"/></svg>';
